<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pendaftaran Clafsity x IT</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>

<div class="container">
    <div id="login-section">
        <h2>Portal Clafsity x IT</h2>
        <p style="text-align: center; color: #aaa;">Silakan login untuk mendaftarkan tim Anda.</p>
        <button id="btn-login" class="btn btn-google">Masuk dengan Google</button>
    </div>

    <div id="dashboard-section" class="hidden">
        <h2>Form Pendaftaran</h2>
        <p id="user-info" style="text-align: center; color: #aaa; margin-bottom: 20px;"></p>

        <form id="registrationForm">
            <div class="form-group">
                <label>Nama Tim</label>
                <input type="text" id="nama_tim" required>
            </div>

            <div id="members-container"></div>

            <button type="submit" class="btn btn-submit" id="btn-submit">Kirim Pendaftaran</button>
        </form>
        <button id="btn-logout" class="btn btn-logout">Logout</button>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
