<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Turnamen - Live ID Checker</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .form-container { background-color: #1e1e1e; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2); }
        h2 { text-align: center; color: #00ffcc; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #aaa; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; background-color: #2a2a2a; color: #fff; font-size: 16px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #00ffcc; }
        .nickname-result { margin-top: 8px; font-size: 14px; font-weight: bold; min-height: 20px; color: #00ffcc; }
        .error-text { color: #ff4d4d; }
        .submit-btn { width: 100%; padding: 14px; background-color: #00ffcc; color: #121212; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .submit-btn:hover { background-color: #00ccaa; }
        .member-section { padding-top: 15px; margin-top: 15px; border-top: 1px dashed #444; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registrasi Tim</h2>
    <form id="turnamenForm">
        
        <div class="form-group">
            <label>Nama Tim</label>
            <input type="text" id="nama_tim" required placeholder="Masukkan Nama Tim">
        </div>

        <div class="member-section">
            <label style="color: #fff; font-size: 16px; margin-bottom: 15px;">Data Kapten</label>
            <div class="form-group">
                <label>Nama Lengkap Kapten</label>
                <input type="text" id="nama_kapten" required placeholder="Nama Asli Kapten">
            </div>
            <div class="form-group">
                <label>ID Game Kapten</label>
                <input type="number" class="id-checker" data-target="result-kapten" required placeholder="Contoh: 12345678">
                <div id="result-kapten" class="nickname-result"></div>
            </div>
        </div>

        <div class="member-section">
            <label style="color: #fff; font-size: 16px; margin-bottom: 15px;">Data Anggota 1</label>
            <div class="form-group">
                <label>Nama Lengkap Anggota 1</label>
                <input type="text" id="nama_member1" required placeholder="Nama Asli Anggota 1">
            </div>
            <div class="form-group">
                <label>ID Game Anggota 1</label>
                <input type="number" class="id-checker" data-target="result-member1" required placeholder="Contoh: 87654321">
                <div id="result-member1" class="nickname-result"></div>
            </div>
        </div>

        <button type="submit" class="submit-btn">Kirim Pendaftaran</button>
    </form>
</div>

<script>
    // Fungsi untuk memanggil API Checker (Saat ini pakai simulasi)
    async function checkInGameID(gameId) {
        // Nanti bagian ini lu ganti pakai fetch() ke backend Node.js lu
        /* const response = await fetch(`https://api-lu.com/check-id?id=${gameId}`);
        const data = await response.json();
        return data.nickname; 
        */

        // -- SIMULASI RESPONSE API (Hapus kalau backend udah jalan) --
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                if(gameId.length < 5) reject("ID tidak ditemukan!"); // Simulasi error
                else resolve("ProPlayer_" + gameId.substring(0,3)); // Simulasi sukses
            }, 1000); // delay 1 detik seolah-olah nunggu server
        });
    }

    // Event Listener buat semua input yang punya class 'id-checker'
    const idInputs = document.querySelectorAll('.id-checker');
    
    idInputs.forEach(input => {
        // Pemicunya jalan saat user selesai ngetik dan klik di luar kotak (blur/change)
        input.addEventListener('change', async function() {
            const gameId = this.value;
            const targetResultId = this.getAttribute('data-target');
            const resultElement = document.getElementById(targetResultId);

            if (!gameId) {
                resultElement.textContent = "";
                return;
            }

            // Tunjukin loading
            resultElement.textContent = "🔍 Mengecek ID...";
            resultElement.className = "nickname-result"; 

            try {
                // Panggil fungsi cek API
                const nickname = await checkInGameID(gameId);
                resultElement.textContent = `✅ Nickname: ${nickname}`;
                resultElement.style.color = "#00ffcc";
            } catch (error) {
                resultElement.textContent = `❌ ${error}`;
                resultElement.style.color = "#ff4d4d";
            }
        });
    });

    // Handle Submit Form
    document.getElementById('turnamenForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Kumpulin datanya di sini
        const dataSubmit = {
            nama_tim: document.getElementById('nama_tim').value,
            kapten: {
                nama: document.getElementById('nama_kapten').value,
                id: document.querySelectorAll('.id-checker')[0].value,
                nickname: document.getElementById('result-kapten').innerText.replace('✅ Nickname: ', '')
            },
            // Tambahin member lain...
        };

        console.log("Data siap dikirim ke backend:", dataSubmit);
        alert("Cek Console Log (F12) buat lihat data json-nya. Data ini yang bakal dikirim ke Node.js & Spreadsheet!");
        
        // Di sini nanti lu tambahin fetch POST ke backend Node.js lu
    });
</script>

</body>
</html>
